[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "certskip"
version = "0.1.0"
description = "Certified patch skipping for video: rules with a theorem about what cannot have changed in a skipped patch"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["python"]
